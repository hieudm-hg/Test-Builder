<div class="permissions-card">
  <div class="card-header">
    <h2 class="card-title">Quyền <span class="required">*</span></h2>
  </div>

  <div class="sections-container">
    <div class="section" *ngFor="let section of sections">
      <div class="section-header" (click)="toggleSection(section.id)">
        <svg class="arrow-icon" [class.expanded]="section.expanded" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M11.9465 5.45337H7.79316H4.05317C3.41317 5.45337 3.09317 6.2267 3.5465 6.68004L6.99983 10.1334C7.55317 10.6867 8.45317 10.6867 9.0065 10.1334L10.3198 8.82004L12.4598 6.68004C12.9065 6.2267 12.5865 5.45337 11.9465 5.45337Z" fill="#A3A3A3"/>
        </svg>
        <h3 class="section-title">{{ section.title }}</h3>
      </div>

      <div class="section-content" [class.collapsed]="!section.expanded">
        <div class="permission-item" *ngFor="let permission of section.permissions; let last = last">
          <div class="permission-info">
            <div class="permission-icon">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6 11.3751C3.035 11.3751 0.625 8.96504 0.625 6.00003C0.625 3.03501 3.035 0.625 6 0.625C8.965 0.625 11.375 3.03501 11.375 6.00003C11.375 8.96504 8.965 11.3751 6 11.3751ZM6 1.375C3.45 1.375 1.375 3.45002 1.375 6.00003C1.375 8.55004 3.45 10.6251 6 10.6251C8.55 10.6251 10.625 8.55004 10.625 6.00003C10.625 3.45002 8.55 1.375 6 1.375Z" fill="#A3A3A3"/>
                <path d="M4.50012 10.8751H4.00012C3.79512 10.8751 3.62512 10.7051 3.62512 10.5001C3.62512 10.2951 3.78512 10.13 3.99012 10.125C3.20512 7.44503 3.20512 4.55502 3.99012 1.875C3.78512 1.87 3.62512 1.705 3.62512 1.5C3.62512 1.295 3.79512 1.125 4.00012 1.125H4.50012C4.62012 1.125 4.73512 1.185 4.80512 1.28C4.87512 1.38 4.89512 1.505 4.85512 1.62C3.91512 4.44502 3.91512 7.55504 4.85512 10.3851C4.89512 10.5001 4.87512 10.6251 4.80512 10.7251C4.73512 10.8151 4.62012 10.8751 4.50012 10.8751Z" fill="#A3A3A3"/>
                <path d="M7.5002 10.875C7.4602 10.875 7.4202 10.87 7.3802 10.855C7.1852 10.79 7.0752 10.575 7.1452 10.38C8.0852 7.555 8.0852 4.44499 7.1452 1.61497C7.0802 1.41997 7.1852 1.20497 7.3802 1.13997C7.5802 1.07497 7.7902 1.17997 7.8552 1.37497C8.8502 4.35499 8.8502 7.635 7.8552 10.61C7.8052 10.775 7.6552 10.875 7.5002 10.875Z" fill="#A3A3A3"/>
                <path d="M6 8.60003C4.605 8.60003 3.215 8.40503 1.875 8.01003C1.87 8.21003 1.705 8.37503 1.5 8.37503C1.295 8.37503 1.125 8.20503 1.125 8.00003V7.50002C1.125 7.38002 1.185 7.26502 1.28 7.19502C1.38 7.12502 1.505 7.10502 1.62 7.14502C4.445 8.08503 7.56 8.08503 10.385 7.14502C10.5 7.10502 10.625 7.12502 10.725 7.19502C10.825 7.26502 10.88 7.38002 10.88 7.50002V8.00003C10.88 8.20503 10.71 8.37503 10.505 8.37503C10.3 8.37503 10.135 8.21503 10.13 8.01003C8.785 8.40503 7.395 8.60003 6 8.60003Z" fill="#A3A3A3"/>
                <path d="M10.4999 4.87506C10.4599 4.87506 10.4199 4.87006 10.3799 4.85506C7.55489 3.91506 4.43989 3.91506 1.61489 4.85506C1.41489 4.92006 1.20489 4.81506 1.13989 4.62006C1.07989 4.42006 1.18489 4.21006 1.37989 4.14506C4.35989 3.15005 7.63989 3.15005 10.6149 4.14506C10.8099 4.21006 10.9199 4.42506 10.8499 4.62006C10.8049 4.77506 10.6549 4.87506 10.4999 4.87506Z" fill="#A3A3A3"/>
              </svg>
            </div>
            <span class="permission-name">{{ permission.name }}</span>
          </div>

          <div class="permission-actions">
            <label class="toggle-switch">
              <input 
                type="checkbox" 
                [checked]="permission.enabled"
                (change)="togglePermission(section.id, permission.id)"
              />
              <span class="toggle-slider"></span>
            </label>

            <div class="permission-status">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M9.99984 18.9583C5.05817 18.9583 1.0415 14.9416 1.0415 9.99996C1.0415 5.05829 5.05817 1.04163 9.99984 1.04163C14.9415 1.04163 18.9582 5.05829 18.9582 9.99996C18.9582 14.9416 14.9415 18.9583 9.99984 18.9583ZM9.99984 2.29163C5.74984 2.29163 2.2915 5.74996 2.2915 9.99996C2.2915 14.25 5.74984 17.7083 9.99984 17.7083C14.2498 17.7083 17.7082 14.25 17.7082 9.99996C17.7082 5.74996 14.2498 2.29163 9.99984 2.29163Z" fill="#2FB25E"/>
                <path d="M8.8167 12.9833C8.65003 12.9833 8.4917 12.9166 8.37503 12.8L6.0167 10.4416C5.77503 10.2 5.77503 9.79996 6.0167 9.55829C6.25837 9.31663 6.65837 9.31663 6.90003 9.55829L8.8167 11.475L13.1 7.19163C13.3417 6.94996 13.7417 6.94996 13.9834 7.19163C14.225 7.43329 14.225 7.83329 13.9834 8.07496L9.25837 12.8C9.1417 12.9166 8.98337 12.9833 8.8167 12.9833Z" fill="#2FB25E"/>
              </svg>
              <span class="status-text">Cho phép</span>
            </div>
          </div>

          <div class="divider" *ngIf="!last"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="scrollbar-track">
    <div class="scrollbar-thumb"></div>
  </div>
</div>
